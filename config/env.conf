# =============================================================================
# Proxmox WireGuard - configuration
#
# This file contains GENERIC defaults.
# The installer auto-detects host/network values where possible and asks for
# confirmation before writing the resolved configuration to config/resolved.conf.
# =============================================================================

# --- VM identity (not configurable) --------------------------------------------
MANAGED_VM_NAME="wireguard-gateway"
MANAGED_TAG="proxmox-wireguard-managed"
MANAGED_DESCRIPTION="Managed by proxmox-wireguard installer"

# --- VM defaults ---------------------------------------------------------------
VMID=""
VM_MEMORY_MB=1024
VM_CORES=1
VM_DISK_GB=8
VM_STORAGE=""
VM_BRIDGE=""
VM_START_ON_BOOT=1
VM_MACHINE="q35"

# Debian 13 official genericcloud image
DEBIAN_IMAGE_URL="https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
DEBIAN_SHA512_URL="https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS"
DEBIAN_IMAGE_CACHE="/var/lib/vz/template/qcow/proxmox-wireguard-debian-13-genericcloud-amd64.qcow2"

# --- Guest / SSH ---------------------------------------------------------------
GUEST_USER="wireguardadmin"
SSH_PRIVATE_KEY="/root/.ssh/wireguard-gateway_ed25519"

# --- Home LAN ------------------------------------------------------------------
VM_IP=""
VM_PREFIX=""
LAN_CIDR=""
LAN_GATEWAY=""
PIHOLE_IP=""

# --- WireGuard -----------------------------------------------------------------
WG_IF="wg0"
WG_PORT=51820
WG_CIDR="10.77.77.0/24"
WG_SERVER_IP="10.77.77.1"
WG_ENDPOINT=""
WG_DETECTED_PUBLIC_IP=""

WG_CLIENT_DNS=""
WG_PERSISTENT_KEEPALIVE=25
WG_MTU=1420

# --- Backup --------------------------------------------------------------------
PVE_BACKUP_STORAGE=""

# --- Safety --------------------------------------------------------------------
REQUIRE_INTERACTIVE_CONFIRMATION="YES"
